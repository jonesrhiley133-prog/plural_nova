# Base44 development compose for PluralNova.
#
#   docker compose -f docker-compose.base44.yml up -d --build
#
# Runs the server (tsx watch, live reload) and the web client (Vite, HMR)
# from the cloned source. The web dev server is exposed on host port 3000
# and proxies /api, /uploads and /realtime to the server container.

services:
  init:
    # One-shot: install dependencies and build the shared domain package so
    # both the server (tsx) and the web client (vite) can import it.
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "apt-get update && apt-get install -y --no-install-recommends python3 make g++ && npm ci --no-audit --no-fund && npm run build -w @pluralnova/shared"

  shared-watch:
    # Incrementally rebuilds the shared domain package on source changes so
    # both the server (tsx watch) and web (vite) pick up edits without a
    # manual rebuild.  The initial build is done by the `init` service.
    image: node:22-bookworm-slim
    working_dir: /app/packages/shared
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: npx tsc -p tsconfig.json --watch --preserveWatchOutput

  server:
    image: node:22-bookworm-slim
    working_dir: /app/packages/server
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - pluralnova-data:/data
    environment:
      - NODE_ENV=development
      - PORT=4000
      - HOST=0.0.0.0
      - PLURALNOVA_DATA_DIR=/data
      - PLURALNOVA_SERVE_WEB=false
    command: npx tsx watch src/index.ts
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  web:
    image: node:22-bookworm-slim
    working_dir: /app/packages/web
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:5173"
    environment:
      - PLURALNOVA_DEV_API=http://server:4000
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: npx vite --host 0.0.0.0 --port 5173

volumes:
  node_modules:
  pluralnova-data:

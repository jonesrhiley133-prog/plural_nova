name: CI

# Runs on the branch's own pushes and on pull requests, so a green tick on a PR
# means the same checks passed that a contributor runs locally.
on:
  push:
    branches: ['**']
  pull_request:

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Builds shared first, which the other two packages typecheck against.
      - run: npm run build

      - run: npm run typecheck

      - run: npm test

  browser:
    name: Browser checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The e2e suite drives a real build through a real server; it needs one
      # running, on the port the suite defaults to.
      - name: Start PluralNova
        run: |
          PLURALNOVA_DATA_DIR="${RUNNER_TEMP}/pluralnova-ci" npm start &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:4000/api/health >/dev/null 2>&1; then
              echo "server is up"
              exit 0
            fi
            sleep 1
          done
          echo "server did not start within 30s" >&2
          exit 1

      - run: npm run test:e2e -w @pluralnova/web

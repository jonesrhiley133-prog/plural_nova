# PluralNova on Fly.io.
#
#   fly launch --no-deploy --copy-config
#   fly volumes create pluralnova_data --size 1
#   fly deploy
#
# Fly runs the Dockerfile as a real machine with a disk attached, which is what
# this app needs: SQLite lives on that disk, and so do uploads, the session
# secret and the push keys.

app = "pluralnova"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PLURALNOVA_DATA_DIR = "/data"

# The database is a file on this volume. That is also why this app runs on
# exactly one machine — two machines would be two different databases, each
# convinced it was the only one. Keep `fly scale count 1`.
[[mounts]]
  source = "pluralnova_data"
  destination = "/data"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  # The realtime channel is a WebSocket on /realtime. Fly passes it through
  # without configuration; it is mentioned so nobody adds some later.
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
